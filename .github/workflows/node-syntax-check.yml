name: Node syntax and Components V2 check

on:
  push:
    branches:
      - feature/staff-ranking
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in src/*.js; do
            node --check "$file"
          done
      - name: Verify Discord Components V2 builders
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          node <<'NODE'
          const {
            ActionRowBuilder,
            ContainerBuilder,
            MessageFlags,
            SeparatorBuilder,
            StringSelectMenuBuilder,
            TextDisplayBuilder,
            SlashCommandBuilder
          } = require('discord.js');
          const menu = new StringSelectMenuBuilder()
            .setCustomId('staff-ranking:category')
            .setPlaceholder('Switch ranking category')
            .addOptions(
              { label: 'Messages', value: 'messages', default: true },
              { label: 'Punishments', value: 'punishments' }
            );
          const container = new ContainerBuilder()
            .setAccentColor(0x3c3c3d)
            .addTextDisplayComponents(new TextDisplayBuilder().setContent('## Staff Rankings'))
            .addSeparatorComponents(new SeparatorBuilder())
            .addActionRowComponents(new ActionRowBuilder().addComponents(menu));
          new SlashCommandBuilder().setName('staff_ranking').setDescription('View staff rankings.');
          if (!MessageFlags.IsComponentsV2 || !container.toJSON().components.length) {
            throw new Error('Discord Components V2 builders are unavailable.');
          }
          console.log('Components V2 builders and slash command builder verified.');
          NODE

      - name: Verify Santa Gift Delivery builders and reward weights
        env:
          DATABASE_URL: postgres://nrr:nrr@127.0.0.1:5432/nrr
          SANTA_GIFT_SACK_IMAGE_URL: https://example.com/sack.png
          SANTA_GIFT_SHAKE_GIF_URL: https://example.com/shake.gif
          SANTA_GIFT_REVEAL_GIF_URL: https://example.com/reveal.gif
          SANTA_GIFT_GOLDEN_IMAGE_URL: https://example.com/golden.png
          SANTA_GIFT_ORDINARY_IMAGE_URL: https://example.com/ordinary.png
          SANTA_GIFT_NAUGHTY_IMAGE_URL: https://example.com/naughty.png
        run: |
          node <<'NODE'
          const feature = require('./src/santa-gift');
          const categoryWeights = feature.GIFTS.reduce((totals, gift) => {
            totals[gift.category] = (totals[gift.category] || 0) + gift.weight;
            return totals;
          }, {});
          if (feature.command.toJSON().name !== 'santa_gift') throw new Error('Santa slash command was not registered.');
          if (feature.GIFTS.length !== 12 || feature.TOTAL_WEIGHT !== 10000) throw new Error('Santa gift pool or total weight is incorrect.');
          if (categoryWeights.golden !== 500 || categoryWeights.ordinary !== 7000 || categoryWeights.naughty !== 2500) {
            throw new Error('Santa gift category odds do not match 5% / 70% / 25%.');
          }
          const components = [
            feature.buildWaitingMessage({ claim_id: 'ci-claim' }),
            feature.buildOpeningMessage(),
            feature.buildRevealMessage(),
            feature.buildResultMessage('12345678901234567', feature.GIFTS[0])
          ];
          for (const component of components) {
            const json = component.toJSON();
            if (!json.components || !json.components.length) throw new Error('A Santa Components V2 state rendered no components.');
          }
          console.log('Santa command, gift weights, and all four Components V2 states verified.');
          NODE
