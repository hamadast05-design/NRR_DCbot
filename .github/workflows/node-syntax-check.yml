name: Node syntax check

on:
  push:
    branches:
      - feature/staff-ranking
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in src/*.js; do
            node --check "$file"
          done
