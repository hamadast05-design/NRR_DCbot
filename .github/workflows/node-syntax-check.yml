name: Node syntax and Components V2 check

on:
  push:
    branches:
      - feature/staff-ranking
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in $(find src -name "*.js"); do
            node --check "$file"
          done
      - name: Test webhook credential encryption
        run: node --test test/*.test.js

      - name: Verify Discord Components V2 builders
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          node <<'NODE'
          const {
            ActionRowBuilder,
            ContainerBuilder,
            MessageFlags,
            SeparatorBuilder,
            StringSelectMenuBuilder,
            TextDisplayBuilder,
            SlashCommandBuilder
          } = require('discord.js');
          const menu = new StringSelectMenuBuilder()
            .setCustomId('staff-ranking:category')
            .setPlaceholder('Switch ranking category')
            .addOptions(
              { label: 'Messages', value: 'messages', default: true },
              { label: 'Punishments', value: 'punishments' }
            );
          const container = new ContainerBuilder()
            .setAccentColor(0x3c3c3d)
            .addTextDisplayComponents(new TextDisplayBuilder().setContent('## Staff Rankings'))
            .addSeparatorComponents(new SeparatorBuilder())
            .addActionRowComponents(new ActionRowBuilder().addComponents(menu));
          new SlashCommandBuilder().setName('staff_ranking').setDescription('View staff rankings.');
          if (!MessageFlags.IsComponentsV2 || !container.toJSON().components.length) {
            throw new Error('Discord Components V2 builders are unavailable.');
          }
          console.log('Components V2 builders and slash command builder verified.');
          NODE

      - name: Verify Santa Gift interactive reveal
        run: |
          node <<'NODE'
          const feature = require('./src/santa-gift');
          const { ButtonStyle } = require('discord.js');
          if (feature.command.toJSON().name !== 'santa_gift') throw new Error('Santa slash command was not registered.');
          if (typeof feature.handleButton !== 'function' || typeof feature.handlePrefixMessage !== 'function') throw new Error('Santa button or addgift handler is missing.');
          if (feature.GIFTS.length !== 0 || feature.DEFAULT_GIFT_WEIGHT !== 1000) throw new Error('Santa gift bank must start empty with the expected default weight.');
          const opening = feature.buildOpeningEmbed('12345678901234567').toJSON();
          if (opening.title !== '🎅 Santa’s Gift Delivery' || !opening.description.includes('<@12345678901234567>')) throw new Error('Santa opening embed content is incorrect.');
          const revealed = feature.buildRevealedEmbed({ title: 'NRR Mystery Prize' }).toJSON();
          if (!revealed.description.includes('Unwrapped Item:') || !revealed.description.includes('NRR Mystery Prize')) throw new Error('Santa revealed embed content is incorrect.');
          const components = feature.buildGiftComponents('12345678901234567');
          if (components[0].components[0].data.style !== ButtonStyle.Success || components[0].components[0].data.disabled) throw new Error('Santa unwrap button is incorrectly configured.');
          if (!feature.buildGiftComponents('12345678901234567', true)[0].components[0].data.disabled) throw new Error('Santa unwrap button is not disabled after reveal.');
          console.log('Santa embed, owner-bound unwrap button, empty gift bank, and addgift handler verified.');
          NODE
